name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: End-to-end checks
        run: bun run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PORT: '4321'
      NUXT_APP_URL: http://localhost:4321
      NUXT_AUTH_SECRET: docker-ci-synthetic-secret-at-least-32-characters
      NUXT_ENTRA_TENANT_ID: 11111111-1111-4111-8111-111111111111
      NUXT_ENTRA_CLIENT_ID: 22222222-2222-4222-8222-222222222222
      NUXT_ENTRA_CLIENT_SECRET: docker-ci-synthetic-client-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and start Docker stack
        run: docker compose --env-file .env.docker.example --project-name dns-console-ci up -d --build --wait --wait-timeout 120

      - name: Check application readiness
        run: curl --fail --silent --show-error http://127.0.0.1:4321/health

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.docker.example --project-name dns-console-ci logs --no-color

      - name: Remove test stack
        if: always()
        run: docker compose --env-file .env.docker.example --project-name dns-console-ci down --volumes --remove-orphans
