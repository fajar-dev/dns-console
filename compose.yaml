name: dns-console

services:
  app:
    image: dns-console:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - sqlite_data:/app/.data
    environment:
      NUXT_SQLITE_PATH: /app/.data/dns-console.sqlite
      NUXT_APP_URL: ${NUXT_APP_URL:-http://localhost:3000}
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:?Set NUXT_AUTH_SECRET in .env.docker}
      NUXT_ENTRA_TENANT_ID: ${NUXT_ENTRA_TENANT_ID:?Set NUXT_ENTRA_TENANT_ID in .env.docker}
      NUXT_ENTRA_CLIENT_ID: ${NUXT_ENTRA_CLIENT_ID:?Set NUXT_ENTRA_CLIENT_ID in .env.docker}
      NUXT_ENTRA_CLIENT_SECRET: ${NUXT_ENTRA_CLIENT_SECRET:?Set NUXT_ENTRA_CLIENT_SECRET in .env.docker}
      NUXT_ENTRA_APP_ROLE: ${NUXT_ENTRA_APP_ROLE:-DNSConsole.Access}
      NUXT_CLOUDFLARE_API_TOKEN: ${NUXT_CLOUDFLARE_API_TOKEN:-}
      NUXT_CLOUDFLARE_ACCOUNT_ID: ${NUXT_CLOUDFLARE_ACCOUNT_ID:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  sqlite_data:
